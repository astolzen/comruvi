[package]
name = "comruvi"
version = "0.0.5"
edition = "2024"
description = "comruvi — ComfyUI Rust Viewer, a local-first image browser for AI generation metadata"
license = "AGPL-3.0-only"

[dependencies]
eframe = "0.31"
egui_extras = { version = "0.31", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde_json = "1"
rfd = "0.15"
arboard = "3"
anyhow = "1"
toml = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
kamadak-exif = "0.5.5"
raw-window-handle = "0.6"
notify = "6"

[target.'cfg(windows)'.dependencies]
drag = "2.1"
