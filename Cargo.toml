[package]
name = "comruvi"
version = "0.0.8"
edition = "2024"
description = "comruvi — ComfyUI Rust Viewer, a local-first image browser for AI generation metadata"
license = "AGPL-3.0-only"

[[bin]]
name = "comruvi"
path = "src/main.rs"

[[bin]]
name = "export-icon"
path = "installer/export_icon.rs"

[dependencies]
eframe = "0.31"
egui = "0.31"
egui_extras = { version = "0.31", features = ["image", "svg"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }
serde_json = "1"
rfd = "0.15"
arboard = "3"
anyhow = "1"
toml = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
kamadak-exif = "0.5.5"
raw-window-handle = "0.6"
notify = "6"
ico = "0.4"
single-instance = "0.3"

[target.'cfg(windows)'.dependencies]
drag = "2.1"

[build-dependencies]
winresource = "0.1"
