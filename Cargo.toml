[package]
name = "comruvi"
version = "0.0.2"
edition = "2024"
description = "comruvi — ComfyUI Rust Viewer, a local-first image browser for AI generation metadata"
license = "MIT"

[dependencies]
eframe = "0.31"
egui_extras = { version = "0.31", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde_json = "1"
rfd = "0.15"
arboard = "3"
anyhow = "1"
